name: Validate full-data structural analysis

on:
  push:
    branches:
      - full-data-network-structure-analysis
    paths:
      - "code/full_data_network_structure_analysis/**"
      - "tests/test_full_data_adjacency_matrix.py"
      - ".github/workflows/test-full-data-structure-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: python -m pip install -r code/full_data_network_structure_analysis/requirements.txt
      - name: Compile all structural-analysis scripts
        run: python -m py_compile code/full_data_network_structure_analysis/*.py
      - name: Run synthetic adjacency-builder tests
        run: python -m unittest discover -s tests -p "test_full_data_adjacency_matrix.py" -v
